name: 编译TVBox测试APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 设置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置Gradle国内镜像
        run: |
          cat > ~/.gradle/gradle.properties <<EOF
          systemProp.gradle.wrapperUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-7.5-bin.zip
          EOF

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 编译Debug包
        run: ./gradlew assembleDebug

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-apk
          path: app/build/outputs/apk/debug/*.apk
